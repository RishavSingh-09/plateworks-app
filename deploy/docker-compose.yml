mkdir -p deploy && cat > deploy/docker-compose.yml <<'EOF'
# PRODUCTION-style stack for the app server (lives in /opt/plateworks).
# Jenkins copies this file there and runs deploy.sh, which sets IMAGE_TAG.
# Secrets come from /opt/plateworks/.env (never committed to git).

name: plateworks

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: plateworks
      POSTGRES_USER: plateworks
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plateworks -d plateworks"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: ${REGISTRY:?set REGISTRY in .env}/plateworks-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: plateworks
      DATABASE_USERNAME: plateworks
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      APP_KEYS: ${APP_KEYS:?set APP_KEYS in .env}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_URL: http://${SERVER_HOST:?set SERVER_HOST in .env}:1337
      IS_PROXIED: "true"
      CORS_ORIGINS: http://${SERVER_HOST}
      SEED_DATA: "true"
    volumes:
      - uploads:/opt/app/public/uploads

  frontend:
    image: ${REGISTRY}/plateworks-frontend:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      STRAPI_INTERNAL_URL: http://backend:1337
      STRAPI_PUBLIC_URL: http://${SERVER_HOST}:1337

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "1337:1337"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # ---------- monitoring ----------
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave

volumes:
  pgdata:
  uploads:
  promdata:
  grafanadata:
EOF
