mkdir -p deploy/nginx && cat > deploy/nginx/default.conf <<'EOF'
# Port 80   -> website (Next.js)
# Port 1337 -> CMS and admin panel (Strapi)
# 127.0.0.11 is Docker's built-in DNS. Using variables makes Nginx
# resolve container names again after a redeploy.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location / {
        set $site http://frontend:3000;
        proxy_pass $site;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 1337;
    server_name _;
    client_max_body_size 50m;

    location / {
        set $cms http://backend:1337;
        proxy_pass $cms;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
EOF
